<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code</title><script src="assets/site.js"></script><link rel="stylesheet" href="assets/style.css">
<style>.qrs{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;text-align:center}.qrs h2{font-size:2rem}.qrs div div{display:inline-block;padding:14px;background:#fff}</style></head><body>
<header><h1>請用手機掃描 QR Code</h1><p>掃描後即可在手機開啟課程首頁與實作練習包，現場跟著一起操作。</p></header>
<main><div class="qrs">
<div><h2>課程入口</h2><div id="q1"></div><p id="u1"></p></div>
<div><h2>練習包</h2><div id="q2"></div><p id="u2"></p></div>
</div></main>
<script src="assets/qrcode.min.js"></script>
<script>
const base=location.href.replace(/[^/]*$/,'');
[['q1','u1',base,'課程入口'],['q2','u2',base+'practice.html','練習包']].forEach(([q,u,url,t])=>{
 const el=document.getElementById(q);
 new QRCode(el,{text:url,width:320,height:320});
 el.querySelectorAll('img').forEach(i=>i.alt='QR Code：用手機掃描開啟'+t);
 el.querySelectorAll('canvas').forEach(c=>c.setAttribute('aria-hidden','true'));
 document.getElementById(u).textContent=url;});
</script><script src="assets/nav.js"></script></body></html>
