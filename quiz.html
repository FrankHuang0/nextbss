<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小測驗</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header><h1>✅ 情境題暖身測驗</h1><a href="index.html">← 入口</a></header>
<main><div id="qs"></div><div class="card"><button onclick="grade()">交卷</button> <b id="score"></b></div></main>
<script>
const Q=[
["【情境】客戶會議剛結束，你要在 10 分鐘內回傳待辦與感謝信。哪個做法最有效率？",["把整段逐字稿貼進去，只說「幫我整理」","貼入會議紀錄，指定輸出：三行摘要＋待辦表（負責人／期限）＋感謝信","先把紀錄手動整理成條列，再交給 AI 潤飾"],1],
["【找錯】提示詞：「幫我寫比較好的提案」。主要問題是？",["太短而且沒有角色、資料、格式與對象","字太少所以 AI 不理你","應該用英文"],0],
["【情境】AI 回答「方案 X 支援 20G 頻寬」，但來源資料沒寫這件事。你該怎麼辦？",["直接用，AI 通常是對的","點開引用核對，找不到來源就視為不可靠，並要求只依來源回答","重問一次直到答案滿意"],1],
["【找錯】同事把客戶全名、聯絡人手機與合約金額整份貼入 AI。最合適的處理？",["沒問題，AI 不會外洩","改為代號／去識別化後再貼，必要時只貼摘要","刪除對話就好"],1],
["【情境】客戶說「競品比較便宜 10%」。使用 NotebookLM 的最佳方式是？",["上傳競品與我方資料，要求比較表與 3 種回應話術，並檢查引用","請 AI 直接說我們比較好","不要準備，現場再說"],0],
["【判斷】哪一個最適合交給 AI，但仍須人最後審閱？",["寄給客戶的報價金額","提案簡報大綱初稿","合約法律條款定稿"],1],
["【情境】提案簡報要快速產出，下列順序何者較好？",["提供痛點／預算／方案 → 先要大綱 → 逐頁改寫","一次要 50 頁完整內容","只給客戶名稱"],0],
["【找錯】AI 回答很長但有一半不切題。最有效的修正是？",["換一個 AI","加上限制：只回答 3 點、用表格、僅依來源","罵它"],1],
["【情境】拜訪大客戶前只有 20 分鐘，財報很長。應該要求 AI 產出？",["整份財報翻譯","現況三重點、可能的 ICT 需求、5 個開場提問","公司歷史沿革"],1],
["【反思】導入 AI 後，你下週的第一步最好是？",["等公司有更完整的規範再說","選 1 個情境，排定下一場會議實際使用","等同事用了再看"],1]];document.getElementById('qs').innerHTML=Q.map((q,i)=>`<div class="card"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>[o,j]).sort(()=>Math.random()-.5).map(([o,j])=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}<div id="r${i}"></div></div>`).join('');
function grade(){let n=0;Q.forEach((q,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);const ok=c&&+c.value===q[2];if(ok)n++;
document.getElementById('r'+i).innerHTML=ok?'<span class=ok>✔ 正確</span>':`<span class=bad>✘ 正解：${q[1][q[2]]}</span>`});
document.getElementById('score').textContent=`得分 ${n} / ${Q.length}`}
</script><script src="assets/nav.js"></script></body></html>
