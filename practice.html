<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>實作練習包</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header><h1>🛠 實作練習包</h1><a href="index.html">← 入口</a></header>
<main>
<div class="card"><b>⚠ 資料安全：</b>只貼虛構或已去識別化的資料。<br><b>練習方式</b>：① 開 <a href="https://notebooklm.google.com" target="_blank">NotebookLM</a> 建立筆記本 → ② 把「範例資料」複製貼成來源（新增來源 → 複製的文字）→ ③ 複製「提示詞」貼到對話框 → ④ 檢查結果，再用「進階追問」深入。<br>範例資料皆為虛構，請勿貼入真實客戶機敏資料。</div>
<div id="list"></div></main>
<script>
const T=["10 分鐘（必練）","10 分鐘","10 分鐘（必練）","10 分鐘","10 分鐘"];\nconst D=["待辦表至少 3 筆，每筆都有負責人與期限；感謝信提到客戶預算與下週五報價。","比較表涵蓋價格／SLA／客服／裝機 4 項；話術能回應「競品比較便宜」。","推薦方案附來源引用；故意問「方案 X 是否支援 20G」，AI 應回答資料未提供，並能點開引用核對。","大綱 8 頁，每頁有 3 個重點；第 3 頁口頭說明稿約 1 分鐘。","整理出 3 個需求與 5 個開場提問，且每項都能對應到來源。"];\nconst S=[
{t:"1. 客戶會議紀錄＋待辦追蹤",d:`【會議紀錄】2026/09/18 台鴻精工 拜訪
與會：王經理（資訊）、陳副總；我方：業務小林
- 王經理表示廠區 3 條產線網路常斷線，希望評估專線備援，預算約每月 8 萬內。
- 陳副總關心資安，詢問是否有 SOC 監控服務，希望下週五前看到初步報價。
- 現行合約 12 月到期，競業曾來接觸，報價低約 10%。
- 約定：我方 9/25 前提供備援架構圖；客戶提供廠區 IP 清單。`,p:`請依這份會議紀錄整理：1) 三行摘要 2) 客戶需求與關注點 3) 待辦事項表（項目／負責人／期限）4) 風險與商機 5) 寄給客戶的感謝信草稿（語氣專業親切）。`,a:"把待辦中期限最近的 3 項排優先順序，並說明理由。"},
{t:"2. 競品與市場研究懶人包",d:`【競品 A】主打低價專線，月費比我們低約 10%，SLA 99.5%，無 24 小時客服。
【競品 B】雲端整合方案，含 SD-WAN，裝機約 30 天，客戶評價佈署慢。
【我方】SLA 99.9%，24 小時客服，全台機房，裝機約 14 天，需另購資安服務。`,p:`請比較三家業者，產出：1) 比較表（價格／SLA／客服／裝機時間／弱點）2) 我方 3 項差異化優勢 3) 面對「競品比較便宜」的 3 種話術 4) 還需要補充哪些資料。`,a:"針對製造業客戶，把話術改成 30 秒電梯簡報。"},
{t:"3. 產品知識庫＋即問即答",d:`【方案 X 企業專線】頻寬 100M～10G，SLA 99.9%，裝機 14 天，月費 2.5 萬起。適用：總部、重要據點。
【方案 Y 行動備援】5G 備援，30 分鐘內自動切換，月費 6 千起。適用：分店、臨時據點。
【方案 Z 資安託管】SOC 7x24 監控，月費 1.2 萬起，需搭配 X 或 Y。`,p:`你是產品專家，只能依來源回答，查無資料請說「資料未提供」。請先回答：客戶有 3 條產線、怕斷線、預算每月 8 萬內，該推薦哪些方案組合？並引用來源段落。`,a:"請做成「客戶需求 × 方案」適配表，並列出需要向客戶確認的 3 個問題。"},
{t:"4. 客戶提案簡報快速生成",d:`客戶：台鴻精工（製造業，員工 600 人，3 廠區）
痛點：產線網路斷線、擔心資安、合約 12 月到期
預算：每月 8 萬內
我方方案：X 企業專線＋Y 行動備援＋Z 資安託管
預期效益：斷線時間降低 80%，統一資安監控`,p:`請依以上資料產出 8 頁提案簡報大綱：每頁含標題、3 個重點、建議圖表。結構：現況痛點→解決方案→效益→費用→導入時程→下一步。語氣針對企業高階主管。`,a:"把第 3 頁改寫成一段 1 分鐘口頭說明稿。（也可用 NotebookLM 的簡報／摘要功能再產出）"},
{t:"5. 財報／產業報告解讀（大客戶準備）",d:`【某製造業公司摘要】營收年增 6%，毛利率下降 2 個百分點；今年投資自動化產線 3 億元；董事長談話強調「數位轉型與供應鏈韌性」；海外廠將於明年擴建。`,p:`請以業務拜訪準備角度整理：1) 公司現況三重點 2) 可能的 ICT／網路需求 3) 對方決策者可能關心的 3 個議題 4) 5 個開場提問。`,a:"把以上整理成客戶心智圖大綱（階層式條列）。"}];
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('list').innerHTML=S.map((s,i)=>`<div class="card"><h2>${s.t}<span class="meta">⏱ ${T[i]}</span></h2><div class="done">✅ <b>完成標準：</b>${D[i]}</div>
<b>範例資料</b> <button class="alt" onclick="cp(${i},'d',this)">複製</button><div class="sample">${esc(s.d)}</div>
<b>提示詞</b> <button onclick="cp(${i},'p',this)">複製</button><pre>${esc(s.p)}</pre>
<b>進階追問</b> <button class="alt" onclick="cp(${i},'a',this)">複製</button><pre>${esc(s.a)}</pre></div>`).join('');
function cp(i,k,b){navigator.clipboard.writeText(S[i][k]);const o=b.textContent;b.textContent='已複製 ✓';setTimeout(()=>b.textContent=o,1200)}
</script><script src="assets/nav.js"></script></body></html>
